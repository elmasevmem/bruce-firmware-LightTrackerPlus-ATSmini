name: Build LightTracker Plus

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release version tag to create (e.g. v0.1). Leave empty for a plain build."
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build lighttracker-plus
    runs-on: ubuntu-latest
    env:
      PIO_ENV: lighttracker-plus
      REL_TAG: ${{ github.event_name == 'release' && github.ref_name || inputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: ${{ runner.os }}-pio-${{ env.PIO_ENV }}-${{ hashFiles('platformio.ini', 'boards/lighttracker-plus/*.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ env.PIO_ENV }}-

      - name: Install dependencies
        run: |
          pip install requests esptool intelhex
          pip install platformio

      - name: Set version
        run: |
          if [[ -n "$REL_TAG" ]]; then version="$REL_TAG"; else version="${GITHUB_SHA::7}"; fi
          sed -i "s/-DBRUCE_VERSION=/-DBRUCE_VERSION='\"$version\"' ; /g" ./platformio.ini

      - name: Compile
        run: |
          set -o pipefail
          platformio run -e "$PIO_ENV" | tee build.log

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Bruce-lighttracker-plus
          path: |
            Bruce-*.*
            .pio/build/lighttracker-plus/firmware.bin
            .pio/build/lighttracker-plus/bootloader.bin
            .pio/build/lighttracker-plus/partitions.bin
          retention-days: 14
          if-no-files-found: error

      - name: Prepare release files
        if: env.REL_TAG != ''
        run: |
          mkdir -p release
          cp Bruce-lighttracker-plus.bin "release/Bruce-lighttracker-plus-${REL_TAG}-full.bin"
          cp .pio/build/lighttracker-plus/firmware.bin "release/Bruce-lighttracker-plus-${REL_TAG}-app.bin"

      - name: Release notes
        if: env.REL_TAG != ''
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 .github/scripts/release_notes.py --version "lighttracker-plus-${REL_TAG}" --tag-glob 'lighttracker-plus-v*' \
            --devices lighttracker-plus --footer .github/release/footer_lighttracker-plus.md --file-version "${REL_TAG}" --out release_notes.md

      - name: Publish GitHub release
        if: env.REL_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lighttracker-plus-${{ env.REL_TAG }}
          target_commitish: ${{ github.sha }}
          name: "LightTracker Plus ${{ env.REL_TAG }}"
          files: release/*
          body_path: release_notes.md
