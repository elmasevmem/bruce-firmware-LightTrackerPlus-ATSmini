name: Build LightTracker Plus

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release version tag to create (e.g. v0.1). Leave empty for a plain build."
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build lighttracker-plus
    runs-on: ubuntu-latest
    env:
      PIO_ENV: lighttracker-plus
      REL_TAG: ${{ github.event_name == 'release' && github.ref_name || inputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: ${{ runner.os }}-pio-${{ env.PIO_ENV }}-${{ hashFiles('platformio.ini', 'boards/lighttracker-plus/*.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ env.PIO_ENV }}-

      - name: Install dependencies
        run: |
          pip install requests esptool intelhex
          pip install platformio

      - name: Set version
        run: |
          if [[ -n "$REL_TAG" ]]; then version="$REL_TAG"; else version="${GITHUB_SHA::7}"; fi
          sed -i "s/-DBRUCE_VERSION=/-DBRUCE_VERSION='\"$version\"' ; /g" ./platformio.ini

      - name: Compile
        run: |
          set -o pipefail
          platformio run -e "$PIO_ENV" | tee build.log

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Bruce-lighttracker-plus
          path: |
            Bruce-*.*
            .pio/build/lighttracker-plus/firmware.bin
            .pio/build/lighttracker-plus/bootloader.bin
            .pio/build/lighttracker-plus/partitions.bin
          retention-days: 14
          if-no-files-found: error

      - name: Prepare release files
        if: env.REL_TAG != ''
        run: |
          mkdir -p release
          cp Bruce-lighttracker-plus.bin "release/Bruce-lighttracker-plus-${REL_TAG}-full.bin"
          cp .pio/build/lighttracker-plus/firmware.bin "release/Bruce-lighttracker-plus-${REL_TAG}-app.bin"

      - name: Publish GitHub release
        if: env.REL_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL_TAG }}
          target_commitish: ${{ github.sha }}
          name: "LightTracker Plus ${{ env.REL_TAG }}"
          files: release/*
          body: |
            Bruce firmware for QRP Labs LightTracker Plus v1.0 (ESP32-S3 + SX1268 E22-400M30S + L80 GPS).

            **Files**
            - `*-full.bin` — merged image (bootloader + partitions + app). Flash at **0x0**.
            - `*-app.bin` — application only, for OTA / Bruce updater (flash at 0x10000).

            **Flash**
            ```
            esptool.py --chip esp32s3 --port <PORT> --baud 460800 write_flash 0x0 Bruce-lighttracker-plus-${{ env.REL_TAG }}-full.bin
            ```
            Or use https://bruce.computer/flasher / ESP Web Tools with the full image at offset 0.

            **Notes**
            - No display: device runs headless. Connect to the Bruce WiFi AP and use the WebUI, or the USB serial CLI (115200).
            - LoRa (SX1268) works in the LoRa Chat module via the SX1262 driver; default radio is set to SX1262.
            - Sub-GHz (CC1101) features are not available on this hardware.
