; QRP Labs LightTracker Plus v1.0 - Bruce environment
; ESP32-S3 MINI (8MB, no PSRAM) + SX1268 (EBYTE E22-400M30S, 433 MHz) + Quectel L80 GPS
; Display: 0.96" SSD1306 128x64 I2C OLED on the OLED header (SDA 3, SCL 4, 0x3C), LovyanGFX
; Input:   single BOOT button (GPIO0), shared HAL (HAS_1_BUTTON):
;            short = Next, double short = Prev, long (550 ms) = Select, extra long (1200 ms) = Back
;
; Pins checked against lightaprs/LightTracker-Plus-1.0 (All_Modules_Test),
; lightaprs/LightLoRaAPRS (variants/light_tracker_plus_v1) and
; richonguzman/LoRa_APRS_Tracker (variants/QRPLabs_LightTracker_Plus_1_0).
;
; Build:  pio run -e lighttracker-plus

[env:lighttracker-plus]
board = esp32s3
board_build.partitions = custom_8Mb.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.arduino.memory_type = qio_qspi
build_src_filter = ${env.build_src_filter} +<../boards/lighttracker-plus>
build_flags =
	${env.build_flags}
	-Iboards/lighttracker-plus
	-DCORE_DEBUG_LEVEL=0
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DUSB_as_HID=1
	-DLIGHTTRACKER_PLUS=1

	; ---- Input ----
	-DHAS_1_BUTTON=1
	-DBTN_ALIAS='"BOOT"'
	-DDEEPSLEEP_WAKEUP_PIN=0
	-DDEEPSLEEP_PIN_ACT=LOW

	; ---- Display: SSD1306 128x64 over I2C (LovyanGFX) ----
	-DUSE_LOVYANGFX=1
	-DLOVYAN_PANEL=Panel_SSD1306
	-DLOVYAN_BUS=Bus_I2C
	-DTFT_SDA=3
	-DTFT_SCL=4
	-DTFT_ADDR=0x3C
	-DTFT_I2C_PORT=0
	-DTFT_I2C_WRITE=400000
	-DTFT_I2C_READ=400000
	-DTFT_CS=-1
	-DTFT_RST=-1
	; Declared the Bruce way (portrait size, used in landscape with ROTATION 1/3) so Bruce's
	; tftWidth/tftHeight and every menu start out as 128x64. The real 128x64 panel geometry is
	; handed to LovyanGFX at runtime in interface.cpp (_setup_gpio).
	-DTFT_WIDTH=64
	-DTFT_HEIGHT=128
	-DTFT_BL=-1
	; 1-bit OLED: draw every non-black colour solid white instead of LovyanGFX's 4x4 dither
	; (Bruce's UI is coloured, dithering turned text and menus into dot patterns).
	; Implemented by the LovyanGFX patch in patch_library_conflicts.py.
	-DLGFX_OLED_NO_DITHER=24
	-DROTATION=1                  ; landscape (Bruce's 180-degree option is rotation 3)
	-DTFT_ROTATION=1              ; panel mounting offset: Bruce rotation 1 = header at the top
	-DDEFAULT_COLOR_INVERTED=0    ; OLED: no colour inversion (TFT default is inverted)
	-DFP=1
	-DFM=1
	-DFG=2

	; ---- LoRa: SX1268 on the SX1262 driver ----
	-DDEFAULT_LORA_RADIO='"SX1262"'
	-DLORA_BUSY=6
	-DLORA_IRQ=5                  ; DIO1
	-DLORA_TCXO_VOLTAGE=1.8
	-DLORA_RXEN=42                ; E22 RF switch
	-DLORA_TXEN=14
	-DLORA_POWER_CTRL=21          ; E22 power (HIGH = on)

	; ---- GPS power: PNP high-side switch, LOW = on ----
	-DGPS_VCC_PIN=33

	; ---- Battery: GPIO1, 560k / 100k divider ----
	-DANALOG_BAT_PIN=1
	-DANALOG_BAT_MULTIPLIER=6.6f
	-DANALOG_BAT_MAX_MV=4200

	-DDEVICE_NAME='"LightTracker Plus"'

	; External IR / one-pin RF modules: free header GPIOs only
	-DIR_TX_PINS='{{"GPIO7", 7}, {"GPIO8", 8}, {"GPIO15", 15}}'
	-DIR_RX_PINS='{{"GPIO8", 8}, {"GPIO7", 7}, {"GPIO15", 15}}'
	-DRF_TX_PINS='{{"GPIO7", 7}, {"GPIO8", 8}, {"GPIO15", 15}}'
	-DRF_RX_PINS='{{"GPIO8", 8}, {"GPIO7", 7}, {"GPIO15", 15}}'

lib_deps =
	${env.lib_deps}
	https://github.com/lovyan03/LovyanGFX#develop

lib_ignore =
	TFT_eSPI
