; QRP Labs LightTracker Plus v1.0 — Bruce environment
; ESP32-S3 (8MB, no PSRAM) + SX1268 (E22-400M30S 433 MHz) + L80 GPS
; No TFT display: Bruce runs headless (WebUI + Serial CLI over USB-CDC).
;
; Build:  pio run -e lighttracker-plus
; Flash:  pio run -e lighttracker-plus -t upload

[env:lighttracker-plus]
board = lighttracker-plus
board_build.partitions = custom_8Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/lighttracker-plus>
build_flags =
	${env.build_flags}
	-Iboards/lighttracker-plus
	-DCORE_DEBUG_LEVEL=0
	-DUSB_as_HID=1

	; ---- I2C (Qwiic / sensor header) ----
	-DGROVE_SDA=3
	-DGROVE_SCL=4
	-DSYS_I2C_SDA=3
	-DSYS_I2C_SCL=4

	; ---- IR / single-pin RF modules (external, on I2C header pins) ----
	-DIR_TX_PINS='{{"Pin 3", GROVE_SDA}, {"Pin 4", GROVE_SCL}}'
	-DIR_RX_PINS='{{"Pin 3", GROVE_SDA}, {"Pin 4", GROVE_SCL}}'
	-DTXLED=GROVE_SDA
	-DRXLED=GROVE_SCL
	-DLED_ON=HIGH
	-DLED_OFF=LOW
	-DRF_TX_PINS='{{"Pin 3", GROVE_SDA}, {"Pin 4", GROVE_SCL}}'
	-DRF_RX_PINS='{{"Pin 3", GROVE_SDA}, {"Pin 4", GROVE_SCL}}'

	; ---- No SD card ----
	-DSDCARD_CS=-1
	-DSDCARD_SCK=-1
	-DSDCARD_MISO=-1
	-DSDCARD_MOSI=-1

	; ---- No TFT (headless) ----
	-DROTATION=1
	-DBACKLIGHT=-1
	-DMINBRIGHT=160
	-DSMOOTH_FONT=1
	-DTFT_DISPON=0x29
	-DTFT_DISPOFF=0x28
	-DTFT_CS=-1
	-DTFT_DC=-1
	-DTFT_RST=-1
	-DTOUCH_CS=-1
	-DTFT_MOSI=-1
	-DTFT_SCLK=-1
	-DTFT_BL=-1
	-DFP=1
	-DFM=2
	-DFG=3
	-DBTN_ALIAS='"OK"'
	-DFM_RSTPIN=-1

	; ---- Shared SPI bus (LoRa) ----
	-DSPI_SCK_PIN=12
	-DSPI_MOSI_PIN=11
	-DSPI_MISO_PIN=13
	-DSPI_SS_PIN=10

	; ---- LoRa SX1268 (E22-400M30S) ----
	-DLORA_SCK=12
	-DLORA_MISO=13
	-DLORA_MOSI=11
	-DLORA_CS=10
	-DLORA_RST=9
	-DLORA_DIO0=5
	-DLORA_IRQ=5
	-DLORA_BUSY=6
	-DLORA_RXEN=42
	-DLORA_TXEN=14
	-DLORA_POWER_CTRL=21
	-DLORA_DEFAULT_SX126X=1
	-DLORA_TCXO_VOLTAGE=1.8

	; ---- GPS Quectel L80 ----
	-DGPS_SERIAL_RX=17
	-DGPS_SERIAL_TX=18
	-DGPS_VCC_PIN=33

	-DDEVICE_NAME='"LightTracker Plus"'

lib_deps =
	${env.lib_deps}
