; ATS Mini (ESP32-S3 + SI4732 pocket receiver) - Bruce environments
; Hardware reference: https://github.com/esp32-si4732/ats-mini
;
; The ATS Mini ships with two different ESP32-S3-WROOM-1 variants, pick the one that matches your unit:
;   ats-mini       8MB flash + Octal (OPI) PSRAM, e.g. N8R8  (default)
;   ats-mini-qspi  8MB flash + Quad  (QSPI) PSRAM, e.g. N8R2
; With the wrong variant the device boot-loops or reports no PSRAM.
;
; Display pins are identical to the Lilygo T-Display S3 (ST7789 170x320, 8-bit parallel).
;
; Build:  pio run -e ats-mini
; Flash:  pio run -e ats-mini -t upload

[env:ats-mini]
board = esp32s3
board_build.partitions = custom_8Mb.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.arduino.memory_type = qio_opi
build_src_filter = ${env.build_src_filter} +<../boards/ats-mini>
build_flags =
	${env.build_flags}
	-Iboards/ats-mini
	-Os
	-DCORE_DEBUG_LEVEL=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DBOARD_HAS_PSRAM=1
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-DATS_MINI=1                  ; enables the built-in SI4732 FM/RDS radio (FM menu)
	-DUSB_as_HID=1

	; ---- Input: rotary encoder (A 2, B 1, push 21), BOOT (0) = Back ----
	-DHAS_ENCODER=1
	-DBTN_ALIAS='"Push"'
	-DDEEPSLEEP_WAKEUP_PIN=21
	-DDEEPSLEEP_PIN_ACT=LOW

	; ---- Display: ST7789 170x320, 8-bit parallel (TFT_eSPI) ----
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED
	-DST7789_DRIVER=1
	-DTFT_BACKLIGHT_ON=1
	-DCGRAM_OFFSET
	-DTFT_RGB_ORDER=TFT_RGB
	-DTFT_INVERSION_ON
	-DTFT_PARALLEL_8_BIT
	-DSMOOTH_FONT=1
	-DTFT_WIDTH=170
	-DTFT_HEIGHT=320
	-DTFT_BL=38
	-DTFT_CS=6
	-DTFT_DC=7
	-DTFT_RST=5
	-DTFT_D0=39
	-DTFT_D1=40
	-DTFT_D2=41
	-DTFT_D3=42
	-DTFT_D4=45
	-DTFT_D5=46
	-DTFT_D6=47
	-DTFT_D7=48
	-DTFT_WR=8
	-DTFT_RD=9
	-DSPI_FREQUENCY=20000000
	-DSPI_READ_FREQUENCY=20000000
	-DINIT_SEQUENCE_3
	-DROTATION=3

	; ---- SI4732 receiver section ----
	-DPIN_POWER_ON=15             ; receiver LDO enable (HIGH = on)
	-DPIN_AMP_EN=10               ; audio amplifier enable (HIGH = on, never pulse it)
	-DAUDIO_MUTE=3                ; hardware L/R mute (HIGH = muted)
	-DSI4732_RESET=16
	-DSI4732_SDA=18
	-DSI4732_SCL=17

	; ---- Battery: GPIO4 behind a divider ----
	-DANALOG_BAT_PIN=4
	-DANALOG_BAT_MULTIPLIER=2.0f
	-DANALOG_BAT_MAX_MV=4200

	-DDEVICE_NAME='"ATS Mini"'

	; No IR / single-pin RF hardware onboard: only offer the spare GPIOs (IO11-IO14) so the
	; SI4732 I2C pins and the display/encoder pins can not be picked by mistake.
	-DIR_TX_PINS='{{"GPIO 11", 11}, {"GPIO 12", 12}, {"GPIO 13", 13}, {"GPIO 14", 14}}'
	-DIR_RX_PINS='{{"GPIO 12", 12}, {"GPIO 13", 13}, {"GPIO 14", 14}, {"GPIO 11", 11}}'
	-DRF_TX_PINS='{{"GPIO 11", 11}, {"GPIO 12", 12}, {"GPIO 13", 13}, {"GPIO 14", 14}}'
	-DRF_RX_PINS='{{"GPIO 12", 12}, {"GPIO 13", 13}, {"GPIO 14", 14}, {"GPIO 11", 11}}'

lib_deps =
	${env.lib_deps}
	pu2clr/PU2CLR SI4735

[env:ats-mini-qspi]
extends = env:ats-mini
board_build.arduino.memory_type = qio_qspi
